<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project Theseus — Ariadne's Thread</title>
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />

    <!-- Zero-build CDN stack (mirrors index.html) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"
    ></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="https://unpkg.com/marked@14.1.3/marked.min.js"></script>
    <script src="https://unpkg.com/dompurify@3.1.7/dist/purify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "monospace"],
            },
            colors: {
              ink: {
                950: "#05070d",
                900: "#0a0e1a",
                850: "#0f1422",
                800: "#141a2b",
                700: "#1c2338",
                600: "#283151",
              },
              neon: {
                cyan: "#00f0ff",
                magenta: "#ff2bd6",
                lime: "#00ff9c",
                amber: "#ffb020",
                red: "#ff3b6b",
              },
              edge: { DEFAULT: "#1f2a44", strong: "#2c3a5e" },
            },
            boxShadow: {
              glow: "0 0 18px rgba(0,240,255,0.25), 0 0 2px rgba(0,240,255,0.5) inset",
              magenta:
                "0 0 18px rgba(255,43,214,0.2), 0 0 2px rgba(255,43,214,0.45) inset",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="/ui/styles/theseus.css" />
  </head>

  <body
    x-data="ariadne()"
    x-init="init()"
    data-testid="ariadne-dashboard"
    class="font-sans antialiased scanline bg-ink-950 text-slate-100 min-h-screen"
  >
    <!-- ========================== TOP BAR ========================== -->
    <header
      class="h-14 shrink-0 topbar-vibrant flex items-center px-5 gap-5 sticky top-0 z-40 scanlines"
    >
      <div class="flex items-center gap-3">
        <div
          class="brand-tile w-9 h-9 rounded-xl flex items-center justify-center text-neon-cyan"
        >
          <i data-lucide="git-merge" class="w-5 h-5"></i>
        </div>
        <div class="leading-tight">
          <div class="text-sm font-semibold tracking-wide text-slate-100">
            Ariadne's Thread
          </div>
          <div class="text-[11px] text-slate-400 font-mono">
            project theseus &middot; global capture
          </div>
        </div>
      </div>
      <div class="flex-1"></div>
      <a
        href="/ui/index.html"
        class="text-xs text-slate-300 hover:text-neon-cyan transition-colors"
        title="Open the legacy mounted Capture Workbench"
      >
        legacy /ui &rarr;
      </a>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 space-y-8">
      <!-- ===== Panel 1: Quick Capture ===== -->
      <section
        class="rounded-2xl border border-edge bg-ink-900/70 p-5 shadow-glow"
        data-testid="panel-capture"
      >
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="zap" class="w-4 h-4 text-neon-cyan"></i>
          <h2 class="text-sm font-semibold tracking-wide text-slate-100">
            Quick Capture
          </h2>
          <span class="text-[11px] text-slate-500 font-mono ml-auto"
            >&rarr; global/inbox/</span
          >
        </div>
        <textarea
          x-model="capture.body"
          rows="3"
          placeholder="Brain dump. Cross-opp insight. Anything I'd otherwise lose."
          class="w-full bg-ink-850 border border-edge rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neon-cyan font-mono"
        ></textarea>
        <div class="flex items-center gap-3 mt-3">
          <input
            x-model="capture.title"
            placeholder="title (optional)"
            class="flex-1 bg-ink-850 border border-edge rounded-lg px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neon-cyan font-mono"
          />
          <input
            x-model="capture.tags"
            placeholder="tags: comma,separated"
            class="flex-1 bg-ink-850 border border-edge rounded-lg px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-neon-cyan font-mono"
          />
          <button
            @click="submitCapture()"
            :disabled="!capture.body.trim() || capture.busy"
            class="px-4 py-1.5 rounded-lg bg-neon-cyan/15 border border-neon-cyan text-neon-cyan text-xs font-semibold hover:bg-neon-cyan/25 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
          >
            <span x-show="!capture.busy">Capture</span>
            <span x-show="capture.busy">Saving&hellip;</span>
          </button>
        </div>
        <div
          x-show="capture.message"
          x-text="capture.message"
          class="mt-2 text-xs font-mono"
          :class="capture.error ? 'text-neon-red' : 'text-neon-lime'"
        ></div>
      </section>

      <!-- ===== Panel 2: Opportunity Pipeline ===== -->
      <section
        class="rounded-2xl border border-edge bg-ink-900/70 p-5"
        data-testid="panel-pipeline"
      >
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="layers" class="w-4 h-4 text-neon-magenta"></i>
          <h2 class="text-sm font-semibold tracking-wide text-slate-100">
            Opportunity Pipeline
          </h2>
          <span class="text-[11px] text-slate-500 font-mono ml-auto"
            >active workspaces</span
          >
        </div>
        <template x-if="!pipeline.length">
          <div class="text-xs text-slate-500 font-mono">No workspaces yet.</div>
        </template>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <template x-for="ws in pipeline" :key="ws.name">
            <a
              :href="`/workspace/${ws.name}`"
              class="block rounded-lg border border-edge bg-ink-850 p-3 hover:border-neon-magenta transition-colors"
            >
              <div
                class="text-sm font-semibold text-slate-100 truncate"
                x-text="ws.name"
              ></div>
              <div class="text-[11px] text-slate-500 font-mono mt-0.5">
                docs:
                <span x-text="ws.documents ?? '—'"></span>
                · entities:
                <span x-text="ws.entities ?? '—'"></span>
              </div>
            </a>
          </template>
        </div>
      </section>

      <!-- ===== Panel 3: Global Inbox ===== -->
      <section
        class="rounded-2xl border border-edge bg-ink-900/70 p-5"
        data-testid="panel-inbox"
      >
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="inbox" class="w-4 h-4 text-neon-lime"></i>
          <h2 class="text-sm font-semibold tracking-wide text-slate-100">
            Global Inbox
          </h2>
          <button
            @click="loadBucket('inbox')"
            class="ml-auto text-[11px] text-slate-400 hover:text-neon-cyan font-mono"
            title="Refresh"
          >
            refresh
          </button>
        </div>
        <template x-if="!inbox.length">
          <div class="text-xs text-slate-500 font-mono">
            Inbox empty. Capture something above.
          </div>
        </template>
        <ul class="space-y-2">
          <template x-for="item in inbox" :key="item.path">
            <li
              class="rounded-lg border border-edge bg-ink-850 p-3 hover:border-neon-lime transition-colors"
            >
              <div class="flex items-start gap-3">
                <div class="flex-1 min-w-0">
                  <div
                    class="text-sm font-semibold text-slate-100 truncate"
                    x-text="item.frontmatter?.title || item.path"
                  ></div>
                  <div
                    class="text-[11px] text-slate-500 font-mono mt-0.5 truncate"
                    x-text="item.path"
                  ></div>
                  <div
                    class="text-xs text-slate-300 mt-1.5 line-clamp-2"
                    x-text="item.preview"
                  ></div>
                </div>
                <div class="text-[10px] text-slate-500 font-mono whitespace-nowrap">
                  <span x-text="item.frontmatter?.date || ''"></span>
                </div>
              </div>
            </li>
          </template>
        </ul>
      </section>

      <!-- ===== Panel 4: LLM Wiki + Panel 5: Intel feed ===== -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <section
          class="rounded-2xl border border-edge bg-ink-900/70 p-5"
          data-testid="panel-wiki"
        >
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="book-open" class="w-4 h-4 text-neon-amber"></i>
            <h2 class="text-sm font-semibold tracking-wide text-slate-100">
              LLM Wiki
            </h2>
            <span class="text-[11px] text-slate-500 font-mono ml-auto"
              >global/llm-wiki/</span
            >
          </div>
          <template x-if="!wiki.length">
            <div class="text-xs text-slate-500 font-mono">
              No wiki pages yet.
            </div>
          </template>
          <ul class="space-y-1">
            <template x-for="item in wiki" :key="item.path">
              <li class="text-sm text-slate-200 truncate">
                <i
                  data-lucide="file-text"
                  class="inline-block w-3 h-3 mr-1 text-slate-500"
                ></i>
                <span x-text="item.frontmatter?.title || item.path"></span>
              </li>
            </template>
          </ul>
        </section>

        <section
          class="rounded-2xl border border-edge bg-ink-900/70 p-5"
          data-testid="panel-intel"
        >
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="radar" class="w-4 h-4 text-neon-magenta"></i>
            <h2 class="text-sm font-semibold tracking-wide text-slate-100">
              Cross-Opportunity Intel
            </h2>
            <span class="text-[11px] text-slate-500 font-mono ml-auto"
              >global/intel/</span
            >
          </div>
          <template x-if="!intel.length">
            <div class="text-xs text-slate-500 font-mono">
              No intel notes yet.
            </div>
          </template>
          <ul class="space-y-2">
            <template x-for="item in intel" :key="item.path">
              <li
                class="rounded border border-edge bg-ink-850 px-3 py-2 text-sm text-slate-200"
              >
                <div
                  class="font-semibold truncate"
                  x-text="item.frontmatter?.title || item.path"
                ></div>
                <div
                  class="text-xs text-slate-400 mt-0.5 line-clamp-2"
                  x-text="item.preview"
                ></div>
              </li>
            </template>
          </ul>
        </section>
      </div>
    </main>

    <script>
      function ariadne() {
        return {
          capture: {
            title: "",
            body: "",
            tags: "",
            busy: false,
            message: "",
            error: false,
          },
          pipeline: [],
          inbox: [],
          wiki: [],
          intel: [],

          async init() {
            await Promise.all([
              this.loadPipeline(),
              this.loadBucket("inbox"),
              this.loadBucket("llm-wiki"),
              this.loadBucket("intel"),
            ]);
            this.$nextTick(() => window.lucide?.createIcons());
          },

          async loadPipeline() {
            try {
              const r = await fetch("/workspaces");
              if (!r.ok) return;
              const data = await r.json();
              const list = Array.isArray(data) ? data : data.workspaces || [];
              this.pipeline = list
                .map((ws) =>
                  typeof ws === "string" ? { name: ws } : ws,
                )
                .filter((ws) => ws && ws.name);
            } catch (e) {
              /* offline: leave empty */
            }
          },

          async loadBucket(bucket) {
            try {
              const r = await fetch(`/api/global/${bucket}?limit=20`);
              if (!r.ok) return;
              const data = await r.json();
              const items = data.items || [];
              if (bucket === "inbox") this.inbox = items;
              else if (bucket === "llm-wiki") this.wiki = items;
              else if (bucket === "intel") this.intel = items;
              this.$nextTick(() => window.lucide?.createIcons());
            } catch (e) {
              /* offline: leave empty */
            }
          },

          async submitCapture() {
            const body = this.capture.body.trim();
            if (!body) return;
            this.capture.busy = true;
            this.capture.message = "";
            this.capture.error = false;
            try {
              const tags = this.capture.tags
                .split(",")
                .map((t) => t.trim())
                .filter(Boolean);
              const r = await fetch("/api/global/capture", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  title: this.capture.title || null,
                  body,
                  tags,
                }),
              });
              if (!r.ok) {
                const detail = await r.text();
                throw new Error(detail || `HTTP ${r.status}`);
              }
              const out = await r.json();
              this.capture.body = "";
              this.capture.title = "";
              this.capture.tags = "";
              this.capture.message = `Saved -> ${out.path || "global/inbox"}`;
              await this.loadBucket("inbox");
            } catch (e) {
              this.capture.error = true;
              this.capture.message = `Failed: ${e.message || e}`;
            } finally {
              this.capture.busy = false;
            }
          },
        };
      }
    </script>
  </body>
</html>
