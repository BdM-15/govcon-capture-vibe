          <!-- ============== SKILL CHAINS ============== -->
          <section x-show="active === 'chains'" x-cloak>
            <div class="flex items-end justify-between mb-5 flex-wrap gap-3">
              <div>
                <h1 class="text-2xl font-bold tracking-tight">
                  <span class="h1-gradient">Skill Chains</span>
                </h1>
                <p class="text-sm text-slate-500 mt-1">
                  Multi-skill runs for the active workspace.
                </p>
              </div>
              <button
                class="pill bg-ink-800 border border-edge text-slate-300 hover:text-neon-cyan hover:border-neon-cyan/50 px-3 py-1.5 text-xs"
                @click="loadChains()"
                :disabled="chains.loading"
              >
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                <span
                  x-text="chains.loading ? 'Refreshing…' : 'Refresh'"
                ></span>
              </button>
            </div>

            <div
              x-show="chains.error"
              class="card border-neon-red/40 bg-neon-red/5 p-3 text-xs text-neon-red mb-4"
              x-text="chains.error"
            ></div>

            <div
              class="card card-accent accent-cyan p-4 mb-4"
              x-init="if (!chains.pipelinesLoaded) loadPipelineLibrary()"
            >
              <div class="flex items-start justify-between gap-3 flex-wrap">
                <div>
                  <h2 class="text-sm font-semibold text-slate-100">
                    Pipeline Library
                  </h2>
                  <p class="text-xs text-slate-500 mt-1 max-w-2xl">
                    Packaged multi-skill graphs (like Prompt Library, but for
                    orchestration). Mission Readiness uses LangGraph wave
                    execution with deterministic merge.
                  </p>
                </div>
                <a
                  x-show="chains.studioUrl"
                  class="pill bg-neon-cyan/10 border border-neon-cyan/40 text-neon-cyan hover:bg-neon-cyan/20 px-3 py-1.5 text-xs"
                  :href="chains.studioUrl"
                  target="_blank"
                  rel="noopener noreferrer"
                  title="Open LangGraph Studio (auto-started with Theseus)"
                >
                  <i data-lucide="workflow" class="w-3.5 h-3.5"></i>
                  LangGraph Studio
                </a>
              </div>
              <div
                x-show="chains.pipelinesError"
                class="text-xs text-neon-red mt-2"
                x-text="chains.pipelinesError"
              ></div>
              <ul class="mt-3 space-y-2">
                <template
                  x-for="pipeline in chains.pipelines"
                  :key="pipeline.pipeline_id"
                >
                  <li
                    class="bg-ink-800/60 border border-edge rounded-md p-3 text-xs"
                  >
                    <div class="flex items-center gap-2 flex-wrap">
                      <span
                        class="text-sm font-semibold text-slate-100"
                        x-text="pipeline.name"
                      ></span>
                      <span
                        class="pill text-[10px] border border-neon-cyan/40 text-neon-cyan"
                        x-text="pipeline.engine"
                      ></span>
                    </div>
                    <p
                      class="text-slate-500 mt-1"
                      x-text="pipeline.description"
                    ></p>
                    <div
                      class="text-[10px] font-mono text-slate-600 mt-2"
                      x-text="'Waves: ' + (pipeline.waves || []).map((w) => w.join(' + ')).join(' → ')"
                    ></div>
                  </li>
                </template>
              </ul>
            </div>

            <div
              class="grid grid-cols-1 xl:grid-cols-[minmax(0,0.9fr)_minmax(0,1.4fr)] gap-4"
            >
              <div class="card p-4">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-sm font-semibold text-slate-200">
                    Runs
                    <span
                      class="text-[11px] font-mono text-slate-600"
                      x-text="'(' + chains.items.length + ')'"
                    ></span>
                  </h2>
                  <span
                    x-show="chains.loading"
                    class="text-[10px] font-mono text-slate-500"
                  >
                    loading
                  </span>
                </div>

                <div
                  x-show="!chains.loading && chains.items.length === 0"
                  class="text-xs font-mono text-slate-600 italic"
                >
                  No chain runs yet.
                </div>

                <ul class="space-y-2 max-h-[62vh] overflow-y-auto pr-1">
                  <template x-for="chain in chains.items" :key="chain.chain_id">
                    <li>
                      <button
                        type="button"
                        class="w-full text-left bg-ink-800/60 border border-edge rounded-md p-3 hover:border-neon-cyan/40 transition-colors"
                        :class="chains.current?.chain_id === chain.chain_id ? 'border-neon-cyan/60 bg-neon-cyan/5' : ''"
                        @click="openChain(chain.chain_id)"
                      >
                        <div class="flex items-start justify-between gap-2">
                          <div class="min-w-0">
                            <div
                              class="text-sm text-slate-100 truncate"
                              x-text="chain.name || 'skill-chain'"
                            ></div>
                            <div
                              class="text-[10px] font-mono text-neon-cyan truncate mt-0.5"
                              x-text="chain.chain_id"
                            ></div>
                          </div>
                          <span
                            class="pill text-[10px] border"
                            :class="chainStatusClass(chain.status)"
                            x-text="chain.status || 'pending'"
                          ></span>
                        </div>
                        <div
                          class="mt-2 text-[10px] font-mono text-slate-500 flex flex-wrap gap-x-2 gap-y-1"
                        >
                          <span
                            x-text="(chain.step_count || 0) + ' steps'"
                          ></span>
                          <span
                            x-show="chain.created_at"
                            x-text="chain.created_at"
                          ></span>
                        </div>
                        <div
                          x-show="chain.error"
                          class="mt-2 text-[10px] font-mono text-neon-red truncate"
                          x-text="chain.error"
                        ></div>
                      </button>
                    </li>
                  </template>
                </ul>
              </div>

              <div class="card p-4 min-h-[360px]">
                <template x-if="!chains.current">
                  <div
                    class="h-full flex items-center justify-center text-xs font-mono text-slate-600 italic"
                  >
                    Select a chain run.
                  </div>
                </template>

                <template x-if="chains.current">
                  <div class="space-y-4">
                    <div class="flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                          <h2
                            class="text-lg font-semibold text-slate-100 truncate"
                            x-text="chains.current.spec?.name || chains.current.chain_id"
                          ></h2>
                          <span
                            class="pill text-[10px] border"
                            :class="chainStatusClass(chains.current.status)"
                            x-text="chains.current.status"
                          ></span>
                          <span
                            x-show="chains.current.mode && chains.current.mode !== 'original'"
                            class="pill text-[10px] border border-edge bg-ink-800 text-slate-400"
                            x-text="chains.current.mode"
                          ></span>
                        </div>
                        <div
                          class="text-[10px] font-mono text-neon-cyan mt-1 break-all"
                          x-text="chains.current.chain_id"
                        ></div>
                        <p
                          x-show="chains.current.spec?.prompt"
                          class="text-xs text-slate-400 mt-2 whitespace-pre-wrap"
                          x-text="chains.current.spec?.prompt"
                        ></p>
                      </div>
                      <div class="flex items-center gap-2 shrink-0">
                        <button
                          type="button"
                          class="pill bg-neon-cyan/10 border border-neon-cyan/40 text-neon-cyan hover:bg-neon-cyan/20 px-3 py-1.5 text-xs"
                          @click="rerunChain(chains.current.chain_id)"
                          :disabled="chains.rerunning === chains.current.chain_id"
                        >
                          <i data-lucide="repeat-2" class="w-3.5 h-3.5"></i>
                          <span
                            x-text="chains.rerunning === chains.current.chain_id ? 'Rerunning…' : 'Rerun'"
                          ></span>
                        </button>
                        <button
                          type="button"
                          x-show="chainCanResume(chains.current)"
                          class="pill bg-neon-amber/10 border border-neon-amber/40 text-neon-amber hover:bg-neon-amber/20 px-3 py-1.5 text-xs"
                          @click="resumeChain(chains.current.chain_id)"
                          :disabled="chains.resuming === chains.current.chain_id"
                        >
                          <i data-lucide="play" class="w-3.5 h-3.5"></i>
                          <span
                            x-text="chains.resuming === chains.current.chain_id ? 'Resuming…' : 'Resume'"
                          ></span>
                        </button>
                      </div>
                    </div>

                    <div
                      class="grid grid-cols-2 md:grid-cols-4 gap-2 text-[10px] font-mono"
                    >
                      <div
                        class="bg-ink-800/60 border border-edge rounded-md p-2"
                      >
                        <div class="text-slate-600 uppercase">steps</div>
                        <div
                          class="text-slate-200"
                          x-text="chainSteps(chains.current).length"
                        ></div>
                      </div>
                      <div
                        class="bg-ink-800/60 border border-edge rounded-md p-2"
                      >
                        <div class="text-slate-600 uppercase">artifacts</div>
                        <div
                          class="text-slate-200"
                          x-text="chainArtifactCount(chains.current)"
                        ></div>
                      </div>
                      <div
                        class="bg-ink-800/60 border border-edge rounded-md p-2"
                      >
                        <div class="text-slate-600 uppercase">created</div>
                        <div
                          class="text-slate-200 truncate"
                          x-text="chains.current.created_at || '—'"
                        ></div>
                      </div>
                      <div
                        class="bg-ink-800/60 border border-edge rounded-md p-2"
                      >
                        <div class="text-slate-600 uppercase">finished</div>
                        <div
                          class="text-slate-200 truncate"
                          x-text="chains.current.finished_at || '—'"
                        ></div>
                      </div>
                    </div>

                    <div
                      x-show="chains.current.error"
                      class="border border-neon-red/40 bg-neon-red/5 rounded-md p-3 text-xs font-mono text-neon-red"
                      x-text="chains.current.error"
                    ></div>

                    <div
                      x-show="chainInputRequest(chains.current)"
                      x-init="mountChainInputPanel($el)"
                    ></div>

                    <div
                      x-show="(chains.events || []).length"
                      class="border border-edge rounded-md p-3"
                    >
                      <div class="flex items-center gap-2 mb-2">
                        <i data-lucide="list-tree" class="w-3.5 h-3.5 text-neon-cyan"></i>
                        <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wide">
                          Live timeline
                        </h3>
                        <span
                          x-show="chains.current?.status === 'running'"
                          class="text-[10px] font-mono text-neon-lime animate-pulse"
                        >
                          polling
                        </span>
                      </div>
                      <ol class="space-y-1 max-h-48 overflow-y-auto pr-1">
                        <template
                          x-for="(evt, idx) in chains.events"
                          :key="idx + '-' + (evt.ts || '')"
                        >
                          <li
                            class="text-[10px] font-mono border-l-2 pl-2 py-0.5"
                            :class="chainEventClass(evt)"
                          >
                            <span class="text-slate-500" x-text="evt.ts || ''"></span>
                            <span class="text-slate-400" x-text="' · ' + (evt.phase || '')"></span>
                            <span x-text="evt.summary || evt.event"></span>
                          </li>
                        </template>
                      </ol>
                    </div>

                    <ol class="space-y-2">
                      <template
                        x-for="step in chainSteps(chains.current)"
                        :key="step.id"
                      >
                        <li
                          class="bg-ink-800/60 border border-edge rounded-md p-3"
                        >
                          <div class="flex items-start justify-between gap-3">
                            <div class="min-w-0">
                              <div class="flex items-center gap-2 flex-wrap">
                                <span
                                  class="pill text-[10px] border"
                                  :class="chainStatusClass(step.status)"
                                  x-text="step.status || 'pending'"
                                ></span>
                                <span
                                  class="text-sm font-semibold text-slate-100"
                                  x-text="step.id"
                                ></span>
                                <span
                                  class="text-[10px] font-mono text-slate-500"
                                  x-text="step.skill"
                                ></span>
                              </div>
                              <div
                                class="mt-2 text-[10px] font-mono text-slate-500 flex flex-wrap gap-x-2 gap-y-1"
                              >
                                <span
                                  x-show="step.elapsed_ms"
                                  x-text="step.elapsed_ms + 'ms'"
                                ></span>
                                <span
                                  x-show="step.run_id"
                                  x-text="step.run_id"
                                ></span>
                                <span
                                  x-text="((step.input_artifacts || []).length || 0) + ' in'"
                                ></span>
                                <span
                                  x-text="((step.artifacts || []).length || 0) + ' out'"
                                ></span>
                              </div>
                            </div>
                            <button
                              type="button"
                              x-show="step.run_id"
                              class="studio-action"
                              title="Open child skill run"
                              @click="openChainStepRun(step)"
                            >
                              <i
                                data-lucide="external-link"
                                class="w-3 h-3"
                              ></i>
                            </button>
                          </div>
                          <div
                            x-show="step.error"
                            class="mt-2 text-[10px] font-mono text-neon-red break-words"
                            x-text="step.error"
                          ></div>
                          <div
                            x-show="(step.input_artifacts || []).length"
                            class="mt-2 text-[10px] font-mono text-slate-500"
                          >
                            <span class="text-slate-600">inputs:</span>
                            <template
                              x-for="artifact in step.input_artifacts"
                              :key="artifact.step_id + ':' + artifact.filename"
                            >
                              <span
                                class="ml-1 text-neon-cyan"
                                x-text="artifact.filename"
                              ></span>
                            </template>
                          </div>
                          <div
                            x-show="(step.artifacts || []).length"
                            class="mt-2 flex flex-wrap gap-1"
                          >
                            <template
                              x-for="artifact in step.artifacts"
                              :key="artifact.name || artifact.filename"
                            >
                              <span
                                class="pill text-[10px] border border-edge bg-ink-900 text-slate-400"
                              >
                                <i
                                  :data-lucide="artifactIcon(artifact.mime, artifact.name || artifact.filename)"
                                  class="w-3 h-3"
                                ></i>
                                <span
                                  x-text="artifact.display_name || artifact.name || artifact.filename"
                                ></span>
                              </span>
                            </template>
                          </div>
                        </li>
                      </template>
                    </ol>
                  </div>
                </template>
              </div>
            </div>
          </section>
