          <!-- ============== PROMPT LIBRARY ============== -->
          <section x-show="active === 'prompts'" x-cloak>
            <div class="flex items-end justify-between mb-5 flex-wrap gap-3">
              <div>
                <h1 class="text-2xl font-bold tracking-tight">
                  <span class="h1-gradient">Prompt Library</span>
                </h1>
                <p class="text-sm text-slate-500 mt-1">
                  Shipley-aligned prompts grouped by capture &amp; proposal
                  phase. Click any card to seed the chat composer.
                </p>
              </div>
              <div class="flex items-center gap-2 text-xs font-mono">
                <input
                  type="text"
                  x-model="promptFilter"
                  placeholder="Filter prompts…"
                  class="bg-ink-900 border border-edge focus:border-neon-cyan/60 outline-none rounded-lg px-3 py-1.5 w-64"
                />
                <span
                  class="pill bg-neon-cyan/10 text-neon-cyan border border-neon-cyan/30"
                >
                  <span x-text="filteredPrompts().length"></span>
                  /
                  <span x-text="promptLibrary.length"></span>
                </span>
              </div>
            </div>

            <template
              x-for="phase in promptPhases()"
              :key="'phase-' + phase.id"
            >
              <div class="mb-6">
                <div class="flex items-center gap-2 mb-3">
                  <span
                    class="pill border"
                    :class="phase.pillClass"
                    x-text="'PHASE ' + phase.id"
                  ></span>
                  <h2
                    class="text-sm font-semibold text-slate-200"
                    x-text="phase.label"
                  ></h2>
                  <span
                    class="text-[11px] font-mono text-slate-500"
                    x-text="phase.items.length + ' prompts'"
                  ></span>
                </div>
                <div
                  class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
                >
                  <template x-for="p in phase.items" :key="p.title">
                    <div
                      class="card card-accent p-4 flex flex-col gap-3 cursor-pointer card-hover"
                      :class="phase.accentClass"
                      @click="usePrompt(p)"
                    >
                      <div class="flex items-start justify-between gap-2">
                        <h3
                          class="text-sm font-semibold text-slate-100 leading-snug"
                          x-text="p.title"
                        ></h3>
                        <span
                          class="pill bg-ink-800 text-slate-400 border border-edge whitespace-nowrap"
                          x-text="p.category"
                        ></span>
                      </div>
                      <p
                        class="text-[12px] text-slate-400 leading-relaxed line-clamp-4"
                        x-text="p.prompt"
                      ></p>
                      <div
                        class="flex items-center justify-between mt-auto pt-2 border-t border-edge"
                      >
                        <button
                          class="text-[11px] font-mono text-neon-cyan hover:text-white inline-flex items-center gap-1"
                          @click.stop="copyPrompt(p)"
                        >
                          <i data-lucide="copy" class="w-3 h-3"></i> Copy
                        </button>
                        <button
                          class="text-[11px] font-mono text-neon-magenta hover:text-white inline-flex items-center gap-1"
                          @click.stop="usePrompt(p)"
                        >
                          Use in chat
                          <i data-lucide="arrow-right" class="w-3 h-3"></i>
                        </button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <div
              x-show="!promptLibrary.length"
              class="card p-10 text-center text-sm text-slate-500"
            >
              <i
                data-lucide="library"
                class="w-8 h-8 mx-auto mb-3 text-slate-600"
              ></i>
              No prompts loaded.
            </div>
          </section>
