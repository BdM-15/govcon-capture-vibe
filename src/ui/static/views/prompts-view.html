          <!-- ============== PROMPT LIBRARY ============== -->
          <section x-show="active === 'prompts'" x-cloak>
            <div class="flex items-end justify-between mb-5 flex-wrap gap-3">
              <div>
                <h1 class="text-2xl font-bold tracking-tight">
                  <span class="h1-gradient">Prompt Library</span>
                </h1>
                <p class="text-sm text-slate-500 mt-1">
                  Shipley-aligned starters for this workspace. Click a card to
                  seed chat, or edit to tune depth and framing per opportunity.
                </p>
                <p
                  class="text-[11px] font-mono text-slate-600 mt-1"
                  x-show="promptLibraryMeta.customized"
                >
                  <span class="text-neon-amber">customized</span>
                  ·
                  <span x-text="promptLibraryMeta.workspace"></span>
                </p>
              </div>
              <div class="flex items-center gap-2 flex-wrap justify-end">
                <button
                  class="btn btn-primary text-xs"
                  @click="openPromptEditor()"
                >
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  New prompt
                </button>
                <label class="btn btn-ghost text-xs cursor-pointer">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                  Import JSON
                  <input
                    type="file"
                    accept="application/json,.json"
                    class="hidden"
                    @change="importPromptLibrary($event.target.files[0]); $event.target.value=''"
                  />
                </label>
                <button
                  class="btn btn-ghost text-xs"
                  @click="exportPromptLibrary()"
                  :disabled="!promptLibrary.length"
                >
                  <i data-lucide="download" class="w-3.5 h-3.5"></i>
                  Export
                </button>
                <button
                  class="btn btn-ghost text-xs text-neon-amber"
                  x-show="promptLibraryMeta.customized"
                  @click="resetPromptLibrary()"
                >
                  <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                  Reset defaults
                </button>
              </div>
            </div>

            <div class="flex items-center gap-3 mb-5 flex-wrap">
              <input
                type="text"
                x-model="promptFilter"
                placeholder="Filter by title, category, or prompt text…"
                class="bg-ink-900 border border-edge focus:border-neon-cyan/60 outline-none rounded-lg px-3 py-1.5 text-sm w-full max-w-md"
              />
              <label
                class="inline-flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none"
              >
                <input
                  type="checkbox"
                  x-model="promptFilterMine"
                  class="rounded border-edge bg-ink-900 text-neon-cyan focus:ring-neon-cyan/40"
                />
                Mine only
              </label>
              <span
                class="pill bg-neon-cyan/10 text-neon-cyan border border-neon-cyan/30 text-xs font-mono"
              >
                <span x-text="filteredPrompts().length"></span>
                /
                <span x-text="promptLibrary.length"></span>
              </span>
            </div>

            <template
              x-for="phase in promptPhases()"
              :key="'phase-' + phase.id"
            >
              <div class="mb-6">
                <div class="flex items-center gap-2 mb-3">
                  <span
                    class="pill border"
                    :class="phase.pillClass"
                    x-text="'PHASE ' + phase.id"
                  ></span>
                  <h2
                    class="text-sm font-semibold text-slate-200"
                    x-text="phase.label"
                  ></h2>
                  <span
                    class="text-[11px] font-mono text-slate-500"
                    x-text="phase.items.length + ' prompts'"
                  ></span>
                </div>
                <div
                  class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
                >
                  <template
                    x-for="p in phase.items"
                    :key="p.id || p.title"
                  >
                    <div
                      class="card card-accent p-4 flex flex-col gap-3 cursor-pointer card-hover group"
                      :class="phase.accentClass"
                      @click="usePrompt(p)"
                    >
                      <div class="flex items-start justify-between gap-2">
                        <h3
                          class="text-sm font-semibold text-slate-100 leading-snug pr-1"
                          x-text="p.title"
                        ></h3>
                        <div class="flex items-center gap-1 shrink-0">
                          <span
                            class="pill text-[10px] border whitespace-nowrap"
                            :class="p.source === 'user'
                              ? 'bg-neon-lime/10 text-neon-lime border-neon-lime/30'
                              : 'bg-ink-800 text-slate-500 border-edge'"
                            x-text="p.source === 'user' ? 'custom' : 'shipped'"
                          ></span>
                          <span
                            class="pill bg-ink-800 text-slate-400 border border-edge whitespace-nowrap text-[10px]"
                            x-text="p.category"
                          ></span>
                        </div>
                      </div>
                      <p
                        class="text-[12px] text-slate-400 leading-relaxed line-clamp-4"
                        x-text="p.prompt"
                      ></p>
                      <div
                        class="flex items-center justify-between mt-auto pt-2 border-t border-edge gap-2"
                      >
                        <div class="flex items-center gap-2">
                          <button
                            class="text-[11px] font-mono text-slate-400 hover:text-white inline-flex items-center gap-1"
                            title="Edit prompt"
                            @click.stop="openPromptEditor(p)"
                          >
                            <i data-lucide="pencil" class="w-3 h-3"></i>
                            Edit
                          </button>
                          <button
                            class="text-[11px] font-mono text-slate-400 hover:text-white inline-flex items-center gap-1"
                            title="Duplicate to editable copy"
                            @click.stop="duplicatePromptEntry(p)"
                          >
                            <i data-lucide="copy-plus" class="w-3 h-3"></i>
                          </button>
                          <button
                            class="text-[11px] font-mono text-slate-500 hover:text-neon-red inline-flex items-center gap-1"
                            :title="p.source === 'user' ? 'Delete custom prompt' : 'Hide shipped prompt'"
                            @click.stop="deletePromptEntry(p)"
                          >
                            <i data-lucide="trash-2" class="w-3 h-3"></i>
                          </button>
                        </div>
                        <div class="flex items-center gap-2">
                          <button
                            class="text-[11px] font-mono text-neon-cyan hover:text-white inline-flex items-center gap-1"
                            @click.stop="copyPrompt(p)"
                          >
                            <i data-lucide="copy" class="w-3 h-3"></i>
                          </button>
                          <button
                            class="text-[11px] font-mono text-neon-magenta hover:text-white inline-flex items-center gap-1"
                            @click.stop="usePrompt(p)"
                          >
                            Use
                            <i data-lucide="arrow-right" class="w-3 h-3"></i>
                          </button>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <div
              x-show="!promptLibrary.length"
              class="card p-10 text-center text-sm text-slate-500"
            >
              <i
                data-lucide="library"
                class="w-8 h-8 mx-auto mb-3 text-slate-600"
              ></i>
              No prompts loaded.
            </div>
          </section>
