          <!-- ============== PROMPT LIBRARY ============== -->
          <section x-show="active === 'prompts'" x-cloak class="space-y-5">
            <div class="flex items-end justify-between flex-wrap gap-3">
              <div>
                <h1 class="text-2xl font-bold tracking-tight">
                  <span class="h1-gradient">Prompt Library</span>
                </h1>
                <p class="text-sm text-slate-500 mt-1 max-w-2xl">
                  One workspace repository for Capture Chat starters and packaged
                  RFP Intelligence / agent-skill bindings. Edit a prompt here —
                  Intelligence and Skills read it on the next run.
                </p>
                <p
                  class="text-[11px] font-mono text-slate-600 mt-1"
                  x-show="promptLibraryMeta.customized"
                >
                  <span class="text-neon-amber">customized</span>
                  ·
                  <span x-text="promptLibraryMeta.workspace"></span>
                </p>
              </div>
              <div class="flex items-center gap-2 flex-wrap justify-end">
                <button
                  class="btn btn-ghost text-xs"
                  @click="promptsExpandAll()"
                  title="Open every section"
                >
                  <i data-lucide="chevrons-down" class="w-3.5 h-3.5"></i>
                  Expand all
                </button>
                <button
                  class="btn btn-ghost text-xs"
                  @click="promptsCollapseAll()"
                  title="Close every section"
                >
                  <i data-lucide="chevrons-up" class="w-3.5 h-3.5"></i>
                  Collapse all
                </button>
                <button
                  class="btn btn-primary text-xs"
                  @click="openPromptEditor()"
                >
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  New chat prompt
                </button>
                <label class="btn btn-ghost text-xs cursor-pointer">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                  Import
                  <input
                    type="file"
                    accept="application/json,.json"
                    class="hidden"
                    @change="importPromptLibrary($event.target.files[0]); $event.target.value=''"
                  />
                </label>
                <button
                  class="btn btn-ghost text-xs"
                  @click="exportPromptLibrary()"
                  :disabled="!promptLibrary.length"
                >
                  <i data-lucide="download" class="w-3.5 h-3.5"></i>
                  Export
                </button>
                <button
                  class="btn btn-ghost text-xs text-neon-amber"
                  x-show="promptLibraryMeta.customized"
                  @click="resetPromptLibrary()"
                >
                  <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                  Reset
                </button>
              </div>
            </div>

            <div class="filter-rail">
              <div class="filter-rail-rows">
                <div class="filter-rail-row">
                  <span class="filter-axis-label filter-axis-label-cyan">
                    <i data-lucide="layers" class="w-3 h-3"></i>Collection
                  </span>
                  <template
                    x-for="filter in promptCollectionFilters()"
                    :key="'pcf-' + filter.id"
                  >
                    <button
                      class="filter-pill"
                      :class="promptCollectionFilter === filter.id ? 'filter-pill-active-cyan' : ''"
                      @click="promptCollectionFilter = filter.id"
                      x-text="filter.label"
                    ></button>
                  </template>
                </div>
              </div>
            </div>

            <div class="flex items-center gap-3 flex-wrap">
              <input
                type="text"
                x-model="promptFilter"
                placeholder="Search title, destination, or prompt text…"
                class="bg-ink-900 border border-edge focus:border-neon-cyan/60 outline-none rounded-lg px-3 py-1.5 text-sm w-full max-w-md"
              />
              <label
                class="inline-flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none"
              >
                <input
                  type="checkbox"
                  x-model="promptFilterMine"
                  class="rounded border-edge bg-ink-900 text-neon-cyan focus:ring-neon-cyan/40"
                />
                Custom only
              </label>
              <span
                class="pill bg-neon-cyan/10 text-neon-cyan border border-neon-cyan/30 text-xs font-mono"
              >
                <span x-text="filteredPrompts().length"></span>
                /
                <span x-text="promptLibrary.length"></span>
              </span>
            </div>

            <div class="space-y-5" data-prompt-sections>
              <template
                x-for="section in promptLibrarySections()"
                :key="'prompt-section-' + section.id"
              >
                <details
                  class="acc"
                  :class="'accent-' + section.accent"
                  :data-acc-key="'prompt-' + section.id"
                  :open="section.defaultOpen || null"
                >
                  <summary>
                    <div class="flex items-center gap-3 min-w-0">
                      <i data-lucide="chevron-right" class="acc-chevron w-4 h-4"></i>
                      <i
                        :data-lucide="section.id === 'briefings' ? 'shield-check' : 'message-square'"
                        class="w-4 h-4 shrink-0"
                        :class="section.id === 'briefings' ? 'text-neon-amber' : 'text-neon-cyan'"
                      ></i>
                      <div class="min-w-0">
                        <div class="font-semibold text-sm" x-text="section.label"></div>
                        <div
                          class="text-[11px] text-slate-500 mt-0.5 truncate"
                          x-text="section.hint"
                        ></div>
                      </div>
                    </div>
                    <span
                      class="text-[10px] font-mono text-slate-600 shrink-0"
                      x-text="promptSectionCount(section)"
                    ></span>
                  </summary>
                  <div class="acc-body space-y-5">
                    <template
                      x-for="group in section.groups"
                      :key="section.id + '-group-' + group.id"
                    >
                      <div>
                        <div
                          class="text-[10px] font-mono uppercase tracking-wider text-slate-500 mb-3 flex items-center gap-2"
                        >
                          <span x-text="group.label"></span>
                          <span class="text-slate-600" x-text="'(' + group.items.length + ')'"></span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                          <template
                            x-for="p in group.items"
                            :key="p.id || p.title"
                          >
                            <div
                              class="card card-accent prompt-lib-card p-4 flex flex-col gap-2.5"
                              :class="'accent-' + section.accent"
                            >
                              <div class="flex items-start justify-between gap-2">
                                <div class="min-w-0 flex-1">
                                  <h3
                                    class="text-sm font-semibold text-slate-100 leading-snug truncate"
                                    x-text="p.title"
                                  ></h3>
                                  <div
                                    class="text-[10px] font-mono text-slate-500 mt-1 flex items-center gap-1.5 min-w-0"
                                  >
                                    <i
                                      :data-lucide="promptDestinationMeta(p).icon"
                                      class="w-3 h-3 shrink-0 text-slate-600"
                                    ></i>
                                    <span
                                      class="truncate"
                                      x-text="promptDestinationMeta(p).line + (promptDestinationMeta(p).detail ? ' · ' + promptDestinationMeta(p).detail : '')"
                                    ></span>
                                  </div>
                                  <div
                                    class="text-[10px] font-mono text-slate-600 mt-0.5 truncate"
                                    x-show="promptDestinationMeta(p).skill"
                                    x-text="promptDestinationMeta(p).skill"
                                  ></div>
                                </div>
                                <span
                                  class="pill text-[10px] border shrink-0"
                                  :class="p.source === 'user'
                                    ? 'bg-neon-lime/10 text-neon-lime border-neon-lime/30'
                                    : 'bg-ink-800 text-slate-500 border-edge'"
                                  x-text="p.source === 'user' ? 'custom' : 'default'"
                                ></span>
                              </div>
                              <p
                                class="prompt-lib-preview text-[12px] text-slate-400 leading-relaxed"
                                x-text="p.prompt"
                              ></p>
                              <div
                                class="flex items-center justify-between gap-2 pt-2 border-t border-edge/70 mt-auto flex-wrap"
                              >
                                <button
                                  type="button"
                                  class="btn btn-primary text-[11px] py-1 px-2"
                                  @click.stop="runPromptPrimaryAction(p)"
                                >
                                  <i
                                    :data-lucide="promptPrimaryAction(p).icon"
                                    class="w-3 h-3"
                                  ></i>
                                  <span x-text="promptPrimaryAction(p).label"></span>
                                </button>
                                <div class="flex items-center gap-2 flex-wrap">
                                  <button
                                    type="button"
                                    class="text-[10px] font-mono text-slate-500 hover:text-neon-cyan"
                                    @click.stop="openPromptEditor(p)"
                                    title="Edit prompt text"
                                  >
                                    Edit
                                  </button>
                                  <button
                                    type="button"
                                    class="text-[10px] font-mono text-slate-500 hover:text-white"
                                    @click.stop="copyPrompt(p)"
                                  >
                                    Copy
                                  </button>
                                  <button
                                    type="button"
                                    class="text-[10px] font-mono text-slate-500 hover:text-white"
                                    x-show="isBriefingPrompt(p)"
                                    @click.stop="usePromptInChat(p)"
                                    title="Load into Capture Chat composer (optional)"
                                  >
                                    Also in chat
                                  </button>
                                  <button
                                    type="button"
                                    class="text-[10px] font-mono text-slate-600 hover:text-white"
                                    @click.stop="duplicatePromptEntry(p)"
                                  >
                                    Dup
                                  </button>
                                  <button
                                    type="button"
                                    class="text-[10px] font-mono text-slate-600 hover:text-neon-red"
                                    @click.stop="deletePromptEntry(p)"
                                    x-text="p.source === 'user' ? 'Del' : 'Hide'"
                                  ></button>
                                </div>
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                </details>
              </template>
            </div>

            <div
              x-show="promptLibrary.length && !promptLibrarySections().length"
              class="card p-10 text-center text-sm text-slate-500"
            >
              <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-3 text-slate-600"></i>
              No prompts match the current filters.
            </div>

            <div
              x-show="!promptLibrary.length"
              class="card p-10 text-center text-sm text-slate-500"
            >
              <i data-lucide="library" class="w-8 h-8 mx-auto mb-3 text-slate-600"></i>
              No prompts loaded.
            </div>
          </section>
